<title>Visvet</title>
<meta name="theme-color" content="#16211c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .gate { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .gate h2 { font-size: 20px; text-wrap: balance; }
  .gate p { max-width: 46ch; }
</style>

<div id="app" aria-live="polite">
  <div class="splash"><span class="logo-text">Visvet</span></div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/store-claude.js"></script>
<script>
  /* Visvet en claude.ai: la cuenta de cada persona es su cuenta de Claude
     y los datos se comparten con la base de datos de la página. */
  (async function () {
    function gate(title, text) {
      var app = document.getElementById('app');
      app.innerHTML = '<div class="gate"><span class="logo-text big">Visvet</span><h2></h2><p class="muted"></p></div>';
      app.querySelector('h2').textContent = title;
      app.querySelector('p').textContent = text;
    }
    var c = window.claude;
    if (!c || typeof c.use !== 'function') {
      return gate('Abre Visvet en claude.ai', 'Esta versión de Visvet funciona dentro de claude.ai, con tu cuenta de Claude.');
    }
    var res = await Promise.all([c.use('db'), c.use('user')]);
    var db = res[0], user = res[1];
    var uid = user ? await user.id() : null;
    if (!db || !uid) {
      return gate('Entra con tu cuenta de Claude', 'Para usar Visvet tienes que haber iniciado sesión en claude.ai y que la persona que gestiona Visvet te haya invitado.');
    }
    window.Store = window.createClaudeStore(db, uid, window.LocalStore);
    var s = document.createElement('script');
    s.src = 'js/app.js';
    document.body.appendChild(s);
  })();
</script>
